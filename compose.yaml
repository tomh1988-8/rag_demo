name: ask-phil

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ask_phil
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: ask_phil
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask_phil -d ask_phil"]
      interval: 2s
      timeout: 5s
      retries: 30

  seed:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://ask_phil:local-demo-only@db:5432/ask_phil
    command: ["ask-phil", "load", "data/seed/phil-arrival-v1.json"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://ask_phil:local-demo-only@db:5432/ask_phil
    ports:
      - "127.0.0.1:${ASK_PHIL_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/snapshots/phil-arrival-v1/evidence/phil-arrival-001', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      ASK_PHIL_TEST_DATABASE_URL: postgresql://ask_phil:local-demo-only@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
