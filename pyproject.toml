[project]
name = "ask-phil"
version = "0.1.0"
description = "Evidence-backed EastEnders demonstration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    "mlflow>=3.16.1",
]

[project.scripts]
ask-phil = "ask_phil.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real disposable PostgreSQL database"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
